<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono&display=swap" rel="stylesheet">
<style>
  :root { --paper: #f3efe6; --ink: #1c1a16; --ink-3: #8a8374; --accent: #c8452c; }
  @media (prefers-color-scheme: dark) { :root { --paper: #161512; --ink: #ece6d8; --ink-3: #847d6f; --accent: #ef7556; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); text-align: center; padding: 16px; box-sizing: border-box; }
  .cat { width: min(320px, 80vw); aspect-ratio: 393 / 233; margin: 0 auto; background: var(--ink-3);
    -webkit-mask: url(/img/cat-404.png) center / contain no-repeat; mask: url(/img/cat-404.png) center / contain no-repeat; }
  h1 { font: italic 400 clamp(2.4rem, 7vw, 3.6rem)/1 "Instrument Serif", Georgia, serif; margin: 2rem 0 0.75rem; }
  p { font: 0.8rem "DM Mono", monospace; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
  a { color: var(--accent); }
</style>
</head>
<body>
  <main>
    <div class="cat" role="img" aria-label="A cat peeking over a sign reading 404"></div>
    <h1>Nothing here but the cat.</h1>
    <p>404 · <a href="/">Back to the homepage</a></p>
  </main>
</body>
</html>
